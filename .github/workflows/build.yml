name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-multimedia-dev \
            qt6-websockets-dev \
            qt6-tools-dev \
            libqt6sql6-sqlite \
            libpoppler-cpp-dev \
            libzip-dev \
            libpugixml-dev \
            cmake ninja-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Package
        if: success()
        run: |
          ./scripts/package.sh --build-dir build --output-dir release
          # AppImage skipped: linuxdeployqt/appimagetool not in apt

      - name: Upload Linux artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIAssistant-Linux
          path: release/*
          if-no-files-found: warn

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 and dependencies
        run: |
          brew install qt@6 poppler libzip pugixml ninja

      - name: Configure
        run:
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix
          qt@6)"

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Package
        if: success()
        run: |
          ./scripts/package.sh \
            --build-dir build \
            --qt-path "$(brew --prefix qt@6)" \
            --output-dir release

      - name: Upload macOS artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIAssistant-macOS
          path: release/*
          if-no-files-found: warn

  test-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: 'qtmultimedia qtwebsockets qttools'

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS --config Release

      - name: Test
        run: cd build && ctest --output-on-failure -C Release

      - name: Package
        if: success()
        shell: bash
        run: |
          ./scripts/package.sh --build-dir build --output-dir release
          # NSIS skipped: makensis not on default runner

      - name: Upload Windows artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIAssistant-Windows
          path: release/*
          if-no-files-found: warn
